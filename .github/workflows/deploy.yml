name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://jothiswaroop.com
          # Web3Forms access key is public by design (client-side); submissions go to hello@jothiswaroop.com
          NEXT_PUBLIC_FORM_ENDPOINT: https://api.web3forms.com/submit
          NEXT_PUBLIC_FORM_KEY: f9ca4a8f-3aae-4f17-8282-70cae56124d5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The build failed silently for 13 hours on 24 Sep and Pages just kept serving the previous
  # version, so nothing looked wrong. Open one issue and keep commenting on it — GitHub emails
  # the repo owner, which is the only alert channel here that needs no secret.
  alert:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create deploy-broken --color B60205 --description "Pages deploy is failing" --repo "$REPO" 2>/dev/null || true
          N=$(gh issue list --repo "$REPO" --state open --label deploy-broken --limit 1 --json number --jq '.[0].number // empty')
          BODY="The site is still up, serving the last good build, but it is frozen at that version until this is fixed.

          Failed run: $RUN"
          if [ -n "$N" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --label deploy-broken \
              --title "Pages deploy is failing — the site is frozen on an older build" --body "$BODY"
          fi
