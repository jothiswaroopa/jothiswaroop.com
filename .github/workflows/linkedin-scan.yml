name: LinkedIn trend scan

on:
  schedule:
    # Fortnightly, the 1st and 15th at 08:30 IST. Weekly was wrong: what works on LinkedIn shifts
    # over months, not weeks, so a weekly scan mostly rephrases last week's answer and grows the
    # topic bank with marginal angles. Daily AI news is already covered by the RSS feeds.
    - cron: "0 3 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: linkedin-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Find what is working on LinkedIn now
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/linkedin/scan.mjs
      # A model can hand back a shape the site cannot render. Building here, before the push, means
      # bad data fails THIS run instead of silently freezing jothiswaroop.com on an older version.
      - name: Check the site still builds with this
        run: npm run build
      - name: Commit
        run: |
          if [ ! -f .li-scanned ]; then echo "nothing"; exit 0; fi
          rm -f .li-scanned
          git config user.name "linkedin-bot"
          git config user.email "linkedin-bot@jothiswaroop.com"
          git add scripts/linkedin/topics.json scripts/linkedin/learning.json public/dash/linkedin-learning.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "LinkedIn weekly scan: $(date -u +%Y-%m-%d)"
          git push
          echo "DEPLOY=1" >> "$GITHUB_ENV"
      - name: Deploy
        if: env.DEPLOY == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run deploy.yml --ref main
