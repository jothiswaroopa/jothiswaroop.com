name: Auto blog post

on:
  schedule:
    - cron: "0 1 */2 * *"   # every 2 days, 06:30 IST
  workflow_dispatch:
    inputs:
      lane:
        description: "Force lane (news | guide) — leave blank to alternate"
        required: false
      topic:
        description: "Force a topic/keyword — leave blank to use feeds/queue"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate, validate, publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_LANE: ${{ inputs.lane }}
          BLOG_TOPIC: ${{ inputs.topic }}
        run: node scripts/blog/generate.mjs
      - name: Commit the post
        run: |
          SLUG=$(cat .blog-published)
          rm -f .blog-published
          git config user.name "blog-bot"
          git config user.email "blog-bot@jothiswaroop.com"
          git add content/blog public/blog/og scripts/blog/covered.json
          git commit -m "Blog: $SLUG"
          git push
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
      # pushes made with GITHUB_TOKEN don't trigger other workflows, so start the Pages deploy explicitly
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Wait for Pages deploy, then ping IndexNow
        run: |
          sleep 240
          node scripts/blog/indexnow.mjs "/blog/$SLUG/" "/blog/" "/feed.xml"
      - name: Keep rejected drafts for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-draft
          path: content/drafts/
          if-no-files-found: ignore
