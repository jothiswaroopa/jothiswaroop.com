name: LinkedIn token check
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Find an accepted LinkedIn-Version
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          echo "426 body from the stale version:"
          curl -s -X POST https://api.linkedin.com/rest/posts \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" -H "LinkedIn-Version: 202405" \
            -H "X-Restli-Protocol-Version: 2.0.0" -H "Content-Type: application/json" -d '{}' | head -c 500
          echo; echo "--- probing versions ---"
          for v in 202606 202605 202604 202603 202602 202601 202512 202511 202510 202509 202508; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST https://api.linkedin.com/rest/posts \
              -H "Authorization: Bearer $LINKEDIN_TOKEN" -H "LinkedIn-Version: $v" \
              -H "X-Restli-Protocol-Version: 2.0.0" -H "Content-Type: application/json" -d '{}')
            echo "$v -> HTTP $code"
            if [ "$code" != "426" ]; then echo "ACCEPTED_VERSION=$v"; break; fi
          done
