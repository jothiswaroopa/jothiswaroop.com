name: SEO/GEO dashboard data

on:
  schedule:
    - cron: "30 23 * * *"   # daily, 05:00 IST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dash
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_TAG: ${{ secrets.CF_ACCOUNT_TAG }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The GEO sweep is the expensive block; collect.mjs runs it weekly on its own.
          # A manual dispatch means someone wants it now, so force it then.
          GEO_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/dash/collect.mjs
      # A model can hand back a shape the site cannot render. Building here, before the push, means
      # bad data fails THIS run instead of silently freezing jothiswaroop.com on an older version.
      - name: Check the site still builds with this
        run: npm run build
      - name: Commit data
        run: |
          git config user.name "dash-bot"
          git config user.email "dash-bot@jothiswaroop.com"
          git add public/dash/data.json
          git diff --cached --quiet || (git commit -m "Dash: $(date -u +%F)" && (git push || (git pull --rebase && git push)) && echo "CHANGED=1" >> "$GITHUB_ENV")
      - name: Deploy
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
