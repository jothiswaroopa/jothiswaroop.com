name: LinkedIn draft

on:
  schedule:
    - cron: "30 0 * * 1-5"   # 06:00 IST, weekdays
  workflow_dispatch:
    inputs:
      pillar:
        description: "Force pillar (receipt | teach | teardown | build | contrarian | story)"
        required: false
      angle:
        description: "Force an angle — leave blank to use the topic bank"
        required: false
      format:
        description: "Force format (text) — blank follows the weekday shape"
        required: false
      force:
        description: "Set to 1 to redraft a day that already has a post"
        required: false
      skip_post:
        description: "Set to 1 to draft only and not publish, whatever LI_AUTOPOST says"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: linkedin
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Free, offline, and before the first API call: if the prompt's worked examples have drifted
      # into claims the fact-checker will hold, the draft is doomed and there is no point paying for
      # it. This is the gate that would have caught the week when three of five days were held.
      - name: Check the drafting prompt teaches the truth
        run: node scripts/linkedin/check-prompt.mjs
      - name: Draft the post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LI_PILLAR: ${{ inputs.pillar }}
          LI_ANGLE: ${{ inputs.angle }}
          LI_FORMAT: ${{ inputs.format }}
          LI_FORCE: ${{ inputs.force }}
        run: node scripts/linkedin/generate.mjs
      # Committed on its own and whatever the outcome: a draft the validator threw away still spent
      # the money, and spend that never got recorded is spend the cap cannot see.
      - name: Record what this run spent
        if: always()
        run: |
          git config user.name "spend-bot"
          git config user.email "spend-bot@jothiswaroop.com"
          git add scripts/spend 2>/dev/null || true
          git diff --cached --quiet && echo "no API calls to record" && exit 0
          git commit -m "Spend: linkedin $(date -u +%F)"
          for i in 1 2 3 4 5; do git push && exit 0; git pull --rebase --autostash || true; done
          echo "could not push the ledger — the next run will under-count the month" >&2; exit 1
      - name: Post to LinkedIn (only if credentials and the switch are set)
        if: hashFiles('.li-drafted') != ''
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}   # optional — derived from the token when unset
          LI_AUTOPOST: ${{ inputs.skip_post == '1' && '0' || vars.LI_AUTOPOST }}
        run: node scripts/linkedin/publish.mjs "$(cat .li-drafted)"
      # A model can hand back a shape the site cannot render. Building here, before the push, means
      # bad data fails THIS run instead of silently freezing jothiswaroop.com on an older version.
      - name: Check the site still builds with this
        if: hashFiles('.li-drafted') != ''
        run: npm run build
      - name: Commit and deploy
        run: |
          if [ ! -f .li-drafted ]; then echo "nothing drafted (weekend or already done)"; exit 0; fi
          DAY=$(cat .li-drafted); rm -f .li-drafted
          git config user.name "linkedin-bot"
          git config user.email "linkedin-bot@jothiswaroop.com"
          git add -A content/linkedin public/linkedin public/dash/linkedin.json scripts/linkedin/covered.json
          git commit -m "LinkedIn draft: $DAY"
          git push
          echo "DEPLOY=1" >> "$GITHUB_ENV"
      # a push with GITHUB_TOKEN doesn't trigger other workflows, so kick Pages off explicitly
      - name: Deploy
        if: env.DEPLOY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
